[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wtwin"
version = "1.2.0"
description = "Forecast-based detection of progressive neural network training degradation"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Dimitar Kretski" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
wtwin = "wtwin.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wtwin*"]